services:

  dall-m-db:
    container_name: dall-m-db
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5497:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/databasepg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dall-m-net

  dall-m-server:
    container_name: dall-m-server
    build:
      context: ./server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: dall-m-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      LLM_BASE_URL: http://dall-m-llamacpp:8080
      LLAMA_HF_MODEL: ${LLAMA_HF_MODEL:-ggml-org/gemma-3-1b-it-GGUF}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      dall-m-db:
        condition: service_healthy
      dall-m-llamacpp:
        condition: service_healthy
    networks:
      - dall-m-net

  dall-m-frontend:
    container_name: dall-m-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "7100:7100"
    environment:
      # Reached from the browser on the host, so these stay as published host ports,
      # not the in-network service names (the frontend has no server-side data fetching).
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/restful}
      NEXT_PUBLIC_LLM_BASE_URL: ${NEXT_PUBLIC_LLM_BASE_URL:-http://localhost:8080}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - dall-m-server
    networks:
      - dall-m-net

  # One-shot, before dall-m-llamacpp: downloads the model it serves
  # (LLAMA_HF_MODEL) and any in PRELOAD_MODELS into ./data/models, skipping
  # what is already there (llamacpp/preload_models.py). dall-m-llamacpp then
  # starts --offline and reads only that cache. The download is Python's
  # huggingface_hub, not llama-server's own, because llama-server ignores
  # HTTPS_PROXY and the production host reaches Hugging Face only through the
  # office proxy: the deploy job exports it, a laptop leaves it empty and goes
  # direct. A rerun with nothing missing makes no network call.
  dall-m-model-preload:
    container_name: dall-m-model-preload
    build:
      context: ./llamacpp
      dockerfile: Dockerfile.preload
    restart: "no"
    volumes:
      - ./data/models:/models
    environment:
      LLAMA_CACHE: /models
      LLAMA_HF_MODEL: ${LLAMA_HF_MODEL:-ggml-org/gemma-3-1b-it-GGUF}
      PRELOAD_MODELS: ${PRELOAD_MODELS:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    networks:
      - dall-m-net

  dall-m-llamacpp:
    container_name: dall-m-llamacpp
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/models:/models
    environment:
      LLAMA_CACHE: /models
    # --offline: serve only what dall-m-model-preload put in the cache, never
    # download here (this downloader cannot use the office proxy).
    # --no-mmproj: the agents send text only, so no vision projector is needed
    # or downloaded.
    command: >
      -hf ${LLAMA_HF_MODEL:-ggml-org/gemma-3-1b-it-GGUF}
      --offline
      --no-mmproj
      --host 0.0.0.0
      --port 8080
    depends_on:
      dall-m-model-preload:
        condition: service_completed_successfully
    networks:
      - dall-m-net
    # Serves only this one model at a time — dall-m-server's LLM_BASE_URL points
    # at one fixed host:port. To serve a second model concurrently rather than
    # switching by recreating this container: copy this block (new
    # container_name, a second host port, and its own -hf), then give
    # dall-m-server a way to pick which of the two to call per agent — today it
    # has exactly one LLM_BASE_URL, so that part is still a real change, not
    # just a compose addition. Both instances would read the same
    # ./data/models volume, so neither downloads what the other already has.


networks:
  dall-m-net:
    driver: bridge