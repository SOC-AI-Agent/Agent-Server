services:

  dall-m-db:
    container_name: dall-m-db
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5497:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/databasepg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dall-m-net

  dall-m-server:
    container_name: dall-m-server
    build:
      context: ./server
    restart: unless-stopped
    ports:
      # 8001 on the host, not 8000: on the production host 8000 belongs to the
      # FastAPI-era stack's soc-backend. NEXT_PUBLIC_BASE_URL below and
      # AI-Service's LLM_SERVER_URL use the same port. SERVER_HOST_PORT
      # (.env.example) moves it if 8001 is ever taken too.
      - "${SERVER_HOST_PORT:-8001}:8000"
    environment:
      DB_HOST: dall-m-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      dall-m-db:
        condition: service_healthy
    networks:
      - dall-m-net

  dall-m-frontend:
    container_name: dall-m-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "7100:7100"
    environment:
      # Reached from the browser on the host, so these stay as published host ports,
      # not the in-network service names (the frontend has no server-side data fetching).
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8001}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/restful}
      NEXT_PUBLIC_LLM_BASE_URL: ${NEXT_PUBLIC_LLM_BASE_URL:-http://localhost:8080}
    # Runs the code built into the image. On a laptop,
    # docker-compose.override.yml mounts ./frontend over it for hot reload.
    depends_on:
      - dall-m-server
    networks:
      - dall-m-net

networks:
  dall-m-net:
    driver: bridge