services:

  dall-m-db:
    container_name: dall-m-db
    image: postgres:18
    restart: unless-stopped
    ports:
      - "5497:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/databasepg:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dall-m-net

  dall-m-server:
    container_name: dall-m-server
    build:
      context: ./server
    restart: unless-stopped
    ports:
      # 8001 on the host, not 8000: on the production host 8000 belongs to the
      # FastAPI-era stack's soc-backend. NEXT_PUBLIC_BASE_URL below and
      # AI-Service's LLM_SERVER_URL use the same port. SERVER_HOST_PORT
      # (.env.example) moves it if 8001 is ever taken too.
      - "${SERVER_HOST_PORT:-8001}:8000"
    environment:
      DB_HOST: dall-m-db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      LLM_BASE_URL: http://dall-m-llamacpp:8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      dall-m-db:
        condition: service_healthy
      dall-m-llamacpp:
        condition: service_healthy
    networks:
      - dall-m-net

  dall-m-frontend:
    container_name: dall-m-frontend
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - "7100:7100"
    environment:
      # Reached from the browser on the host, so these stay as published host ports,
      # not the in-network service names (the frontend has no server-side data fetching).
      NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL:-http://localhost:8001}
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH:-/restful}
      NEXT_PUBLIC_LLM_BASE_URL: ${NEXT_PUBLIC_LLM_BASE_URL:-http://localhost:8080}
    # Runs the code built into the image. On a laptop,
    # docker-compose.override.yml mounts ./frontend over it for hot reload.
    depends_on:
      - dall-m-server
    networks:
      - dall-m-net

  # One-shot, before dall-m-llamacpp: downloads the model it serves and any
  # others listed into ./data/models, skipping what is already there, and
  # writes the served one's name to ./data/models/served-model. Which model is
  # chosen at the top of llamacpp/preload_models.py, nowhere else; it is built
  # into this image, so changing it is a rebuild. dall-m-llamacpp then
  # starts --offline and reads only that cache. The download is Python's
  # huggingface_hub, not llama-server's own, because llama-server ignores
  # HTTPS_PROXY and the production host reaches Hugging Face only through the
  # office proxy: the deploy job exports it, a laptop leaves it empty and goes
  # direct. A rerun with nothing missing makes no network call.
  dall-m-model-preload:
    container_name: dall-m-model-preload
    build:
      context: ./llamacpp
      dockerfile: Dockerfile.preload
      # No provenance attestation: it carries the build time, so every deploy
      # would make a new image even with nothing changed, and dall-m-llamacpp
      # (restart: true below) would restart each time instead of only when
      # the model changes.
      provenance: false
    restart: "no"
    volumes:
      - ./data/models:/models
    environment:
      LLAMA_CACHE: /models
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
    networks:
      - dall-m-net

  dall-m-llamacpp:
    container_name: dall-m-llamacpp
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/models:/models
    environment:
      LLAMA_CACHE: /models
    # -hf: the model dall-m-model-preload wrote to served-model, read at each
    # start through a shell (the image's own entrypoint is llama-server, which
    # cannot read a file for an argument). exec keeps llama-server PID 1, so
    # it gets the stop signal itself.
    # --offline: serve only what dall-m-model-preload put in the cache, never
    # download here (this downloader cannot use the office proxy).
    # --no-mmproj: the agents send text only, so no vision projector is needed
    # or downloaded.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec /app/llama-server -hf "$$(cat /models/served-model)" --offline --no-mmproj --host 0.0.0.0 --port 8080
    depends_on:
      # restart: true — when the preload is rebuilt (the model changed), this
      # is restarted after it, onto the new served-model. A deploy that
      # changes nothing leaves it running.
      dall-m-model-preload:
        condition: service_completed_successfully
        restart: true
    networks:
      - dall-m-net
    # Serves only this one model at a time — dall-m-server's LLM_BASE_URL points
    # at one fixed host:port. To serve a second model concurrently rather than
    # switching by recreating this container: copy this block (new
    # container_name, a second host port, and its own -hf rather than
    # served-model), then give
    # dall-m-server a way to pick which of the two to call per agent — today it
    # has exactly one LLM_BASE_URL, so that part is still a real change, not
    # just a compose addition. Both instances would read the same
    # ./data/models volume, so neither downloads what the other already has.


networks:
  dall-m-net:
    driver: bridge