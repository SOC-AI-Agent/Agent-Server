# Agent-Server (DALL-M) — the agent platform. Ported from the LLM-Server
# project's pipeline when the SOC stack moved off LLM-Server onto this repo;
# the technique below (write_env, never an artifact, never printed) is that
# project's, kept because the reasoning still applies here unchanged.
#
# Nothing in this repo's own files was touched to add this pipeline: it reads
# .env.example, server/Dockerfile, frontend/Dockerfile and docker-compose.yml
# exactly as they already are.
#
# deploy_production's `docker compose up --wait` (step 1) also waits for
# dall-m-model-preload: dall-m-llamacpp starts only once MODEL is on disk, and
# the first deploy after MODEL changes downloads it then — about half an hour
# for Qwen2.5-7B through the office proxy. That wait is bounded by UP_TIMEOUT,
# under the job's own timeout, and prints the download's progress meanwhile.

stages:
  - build
  - test
  - inspect
  - deploy

# The office proxy, the runner host's only way to the internet. A CI/CD
# variable of the same name overrides this; an empty one turns the proxy off.
variables:
  BUILD_PROXY: "http://192.168.137.120:8080"


# ── Reusable: write .env from CI variables ──────────────────────────────────
#
# Not sed. A password containing | or / breaks the expression, and one
# containing & is silently replaced by the matched text — the pipeline goes
# green and the service cannot log in. This reads the keys from .env.example
# and takes any that exist in the environment, whatever characters they hold.
#
# The result is never an artifact and never printed. Putting filled-in
# credentials in GitLab's artifact store, or logging everything but the keys
# that look like a password, are both how a pipeline leaks a secret while
# looking clean.
.write_env: &write_env |
  set -eu
  : > .env
  while IFS= read -r line || [ -n "$line" ]; do
    case "$line" in
      ''|'#'*) printf '%s\n' "$line" >> .env; continue ;;
    esac
    key=${line%%=*}
    if [ "$key" = "$line" ]; then printf '%s\n' "$line" >> .env; continue; fi
    if eval "[ \"\${${key}+set}\" = set ]"; then
      eval "printf '%s=%s\n' \"\$key\" \"\$$key\"" >> .env
    else
      printf '%s\n' "$line" >> .env
    fi
  done < .env.example
  echo "wrote .env — keys taken from CI variables:"
  while IFS= read -r line; do
    key=${line%%=*}
    case "$key" in ''|'#'*) continue ;; esac
    if eval "[ \"\${${key}+set}\" = set ]"; then echo "  $key"; fi
  done < .env.example

# ── Reusable: the office proxy ──────────────────────────────────────────────
#
# Without it apt, npm, pip and prisma time out on the runner host ("Unable to
# locate package"). Exported for the npm/pip a job runs itself, and handed to
# `docker build` / `docker compose build` as PROXY_ARGS: a build does not
# inherit the job's environment. These are Docker's predefined proxy build
# args — no ARG line needed in any Dockerfile, and they stay out of the image's
# history. Both spellings, because apt reads only the lowercase ones. Set inside
# the script, after the checkout, so `git clone` never goes through the proxy.
.proxy: &proxy |
  p="${BUILD_PROXY:-}"
  np="localhost,127.0.0.1"
  export http_proxy="$p" https_proxy="$p" HTTP_PROXY="$p" HTTPS_PROXY="$p" \
         no_proxy="$np" NO_PROXY="$np"
  PROXY_ARGS="--build-arg http_proxy=$p --build-arg https_proxy=$p --build-arg HTTP_PROXY=$p --build-arg HTTPS_PROXY=$p --build-arg no_proxy=$np --build-arg NO_PROXY=$np"
  if [ -n "$p" ]; then echo "proxy: on"; else echo "proxy: off (BUILD_PROXY is empty)"; fi

build_image:
  stage: build
  image: docker:latest
  tags:
    - llm
  # Builds on the runner host's own Docker daemon, through the socket the llm
  # runner mounts — no docker:dind. One fixed tag, overwritten each run: the
  # host is the production machine, and an image per commit would pile up on
  # its disk.
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  script:
    - *proxy
    - docker build $PROXY_ARGS -t dall-m-server:ci ./server
    - docker build $PROXY_ARGS -t dall-m-frontend:ci ./frontend
    - docker build $PROXY_ARGS -t dall-m-model-preload:ci -f llamacpp/Dockerfile.preload ./llamacpp
  rules:
    - if: '$CI_COMMIT_BRANCH'

code_test:
  stage: test
  image: python:3.12
  tags:
    - llm
  script:
    - *proxy
    - cd server
    - pip install -q -r requirements.txt
    - python -c "import app.main"
    # Syntax only — the bootstrap scripts need a live Postgres to run for real,
    # which is what deploy_production exercises them against.
    - cd ../script
    - python -m py_compile *.py
  rules:
    - if: '$CI_COMMIT_BRANCH'

frontend_test:
  stage: test
  image: node:20
  tags:
    - llm
  script:
    - *proxy
    - cd frontend
    - npm ci
    # next build reads NEXT_PUBLIC_* at build time; throwaway values are fine —
    # this only checks that the app compiles and type-checks, nothing here talks
    # to a real API. The deployed container runs `next dev`, not this build.
    - |
      cat > .env.local <<'EOF'
      NEXT_PUBLIC_BASE_URL=http://localhost:8001
      NEXT_PUBLIC_BASE_PATH=/restful
      NEXT_PUBLIC_LLM_BASE_URL=http://localhost:8080
      EOF
    - npm run build
  rules:
    - if: '$CI_COMMIT_BRANCH'

# Which host ports the SOC stack publishes on this machine and what holds each
# one, this host's addresses, and its packet filter. Read-only
# (script/inspect-ports.sh, the same file as Backend's scripts/inspect-ports.sh). For a
# port that answers on the host but times out from a browser, it shows whether
# this host drops the packets or the network between does. By itself on main,
# before deploy_production; a button (▶) on other protected branches. Never
# stops a pipeline.
inspect_ports:
  stage: inspect
  image: docker:latest
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  # Reads production without deploying to it; whoever may deploy to the
  # protected "production" environment is who may run this.
  environment:
    name: production
    action: access
  needs: []
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      allow_failure: true
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - sh script/inspect-ports.sh

# When the admin UI will not let someone in. Press ▶ after a failed attempt:
#   - the users there are: names and flags, never passwords
#   - whether AGENT_ADMIN_USERNAME / AGENT_ADMIN_PASSWORD log in
#   - the login attempts the server saw in the last 24 hours, and why each
#     failed (unknown user / wrong password). None at all means the browser's
#     request never reached the API: the address below, or a firewall.
#   - the API address the running admin UI calls (NEXT_PUBLIC_BASE_URL)
# Reads only, apart from that one login of its own.
check_admin_login:
  stage: inspect
  image: docker:latest
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    action: access
  needs: []
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - |
      echo "== Users (no passwords) =="
      docker exec dall-m-db psql -U "$DB_USER" -d "$DB_NAME" -P pager=off \
        -c "SELECT username, email, is_admin, is_active, created_at FROM users ORDER BY created_at;"

      echo "== Logging in as ${AGENT_ADMIN_USERNAME:-admin} with AGENT_ADMIN_PASSWORD =="
      tar -C script -cf - . | docker run --rm -i --network agent-server_dall-m-net \
        -e http_proxy -e https_proxy -e no_proxy -e AGENT_ADMIN_USERNAME -e AGENT_ADMIN_PASSWORD \
        python:3.12-slim sh -c "mkdir /script && cd /script && tar -xf - \
          && pip install --no-cache-dir -q -r requirements.txt \
          && python add_admin_user.py --check-only --check-login http://dall-m-server:8000"

      echo "== Login attempts the server logged (last 24 hours) =="
      attempts=$(docker logs --since 24h dall-m-server 2>&1 | grep -E 'login\.(success|failed)' | tail -n 20 || true)
      if [ -n "$attempts" ]; then echo "$attempts"
      else echo "(none — no login reached the API: check the address below, and the firewall)"; fi

      echo "== The API the running admin UI calls =="
      docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' dall-m-frontend | grep '^NEXT_PUBLIC_' || true
      echo "It must be http://<this host's address>:8001, reachable from the browser too."

# Sets the password of AGENT_ADMIN_USERNAME (default admin) to
# AGENT_ADMIN_PASSWORD — creating the user, as an admin, if there is none —
# then logs in with it. For when check_admin_login says the variable's
# password does not log in (the user was made earlier with another one).
# Changes the database, so a button (▶) only, never run by itself.
reset_admin_password:
  stage: inspect
  image: docker:latest
  tags:
    - llm
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
  environment:
    name: production
    action: access
  needs: []
  rules:
    - if: '$CI_COMMIT_REF_PROTECTED == "true"'
      when: manual
      allow_failure: true
  script:
    - |
      : "${AGENT_ADMIN_PASSWORD:?set the CI variable AGENT_ADMIN_PASSWORD first}"
      tar -C script -cf - . | docker run --rm -i --network agent-server_dall-m-net \
        -e http_proxy -e https_proxy -e no_proxy \
        -e DB_HOST=dall-m-db -e DB_PORT=5432 -e DB_USER -e DB_PASSWORD -e DB_NAME \
        -e AGENT_ADMIN_USERNAME -e AGENT_ADMIN_PASSWORD \
        python:3.12-slim sh -c "mkdir /script && cd /script && tar -xf - \
          && pip install --no-cache-dir -q -r requirements.txt \
          && python add_admin_user.py --check-login http://dall-m-server:8000"

deploy_production:
  stage: deploy
  image: docker:latest
  # The runner installed on the machine that hosts the stack — see Backend's
  # or LLM-Server's .gitlab-ci.yml for why this has to be a specific runner
  # rather than a shared one. Change the tag if Agent-Server deploys to a
  # different host than the rest of the SOC stack.
  tags:
    - llm
  # Room for a first deploy that downloads MODEL (see UP_TIMEOUT). A runner
  # whose own maximum is lower caps this.
  timeout: 90m
  variables:
    DOCKER_HOST: unix:///var/run/docker.sock
    DOCKER_TLS_CERTDIR: ""
    # Seconds `docker compose up --wait` may take, the model download
    # included: 4.7 GB at the ~2.4 MB/s measured through the office proxy is
    # ~35 minutes, so this leaves twice that. A CI/CD variable overrides it.
    UP_TIMEOUT: "4800"
  environment:
    name: production
    # The admin UI — what a person actually opens — at the address step 5
    # found answering, handed over in deploy.env.
    url: '$DYNAMIC_ENVIRONMENT_URL'
  # deploy.env holds that one URL and nothing else — never .env.
  artifacts:
    reports:
      dotenv: deploy.env
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - echo "========== 0. Required CI variables =========="
    # Every value this deploy uses comes from Settings > CI/CD > Variables.
    # .env.example's values are for a laptop (password123, dev-secret-change-me,
    # localhost) and a deploy that fell back to them would come up looking
    # fine. So a missing one stops the pipeline here, before anything is
    # built or started, with every missing name listed at once.
    #
    # The seed steps below read these from the job's environment, not from
    # .env (their container mounts only script/), so this check is also what
    # keeps them from running with an empty DB_USER.
    #
    # Optional, with working defaults in .env.example and overridable the
    # same way: JWT_EXPIRE_MINUTES, LOG_LEVEL, NEXT_PUBLIC_BASE_PATH,
    # SERVER_HOST_PORT (default 8001, as 8000 is taken on the production host —
    # see .env.example).
    # AGENT_ADMIN_PASSWORD is required: step 3 creates the first admin with it
    # (AGENT_ADMIN_USERNAME optional, default admin). The model is not a
    # variable at all: it is chosen at the top of llamacpp/preload_models.py.
    - |
      missing=""
      for key in DB_USER DB_PASSWORD DB_NAME JWT_SECRET AGENT_ADMIN_PASSWORD \
                 NEXT_PUBLIC_BASE_URL NEXT_PUBLIC_LLM_BASE_URL; do
        eval "value=\${$key:-}"
        [ -n "$value" ] || missing="$missing $key"
      done
      if [ -n "$missing" ]; then
        echo "set these in Settings > CI/CD > Variables:$missing"
        exit 1
      fi
      echo "  all set"

    - *write_env
    # Fixed rather than left to whatever GitLab names the checkout directory:
    # every docker compose call below, and the network name docker run needs
    # to join, depend on this being the same project name every time.
    - export COMPOSE_PROJECT_NAME=agent-server
    # docker-compose.yml alone: docker-compose.override.yml is for a laptop
    # (it bind-mounts frontend/, which does not exist on this host — see below).
    - export COMPOSE_FILE=docker-compose.yml

    - echo "========== Host ports =========="
    # Before anything is built: each host port this stack publishes, and which
    # other container holds it now. `up` would say only "port is already
    # allocated", after the build; this says what to set. SERVER_HOST_PORT
    # moves the API (the Backend's inspect_ports job names a free port); 7100,
    # 8080 and 5497 are fixed in docker-compose.yml. If it is set and the port
    # has not moved, either this job cannot see the variable or this repo's
    # docker-compose.yml predates it — the two are told apart below.
    - |
      ports=$(docker compose config --format json | sed -n 's/.*"published": *"*\([0-9][0-9]*\).*/\1/p' | sort -u)
      echo "SERVER_HOST_PORT in this job: ${SERVER_HOST_PORT:-not set}"
      echo "published by this stack: $(echo $ports)"
      if [ -n "${SERVER_HOST_PORT:-}" ] && ! printf '%s\n' $ports | grep -qx "$SERVER_HOST_PORT"; then
        echo "SERVER_HOST_PORT is $SERVER_HOST_PORT, but docker-compose.yml does not publish it:"
        echo "this repo's docker-compose.yml is older than SERVER_HOST_PORT. Copy the current one."
        exit 1
      fi
      busy=""
      for port in $ports; do
        holder=$(docker ps --filter "publish=$port" --format '{{.Names}} ({{.Label "com.docker.compose.project"}})' \
          | grep -v "($COMPOSE_PROJECT_NAME)\$" | tr '\n' ' ' || true)
        if [ -n "$holder" ]; then echo "  $port: held by $holder"; busy="$busy $port"; fi
      done
      if [ -n "$busy" ]; then
        echo "Set the CI variable SERVER_HOST_PORT to a free port (inspect_ports in Backend names one)."
        echo "Already set? Then this job cannot see it: Protected while main is not a"
        echo "protected branch, or an environment scope other than All or production."
        exit 1
      fi
      echo "  all free (or this stack's own)"

    - echo "========== 1. Build and start =========="
    # One `up` for the whole stack, so that a changed MODEL restarts
    # dall-m-llamacpp (depends_on ... restart: true — a separate run of the
    # preload first would not). It includes the preload's download of MODEL,
    # which on the first deploy after a change takes the better part of an
    # hour: bounded by UP_TIMEOUT, with the size of the model cache printed
    # every minute meanwhile so the log shows it moving. Timed out with the
    # download still running, it carries on in the background; the next
    # deploy finds it, waits for the rest, and starts llama-server.
    - *proxy
    - docker compose build $PROXY_ARGS
    - |
      docker compose up -d --wait --wait-timeout "$UP_TIMEOUT" &
      up=$!
      while kill -0 "$up" 2>/dev/null; do
        sleep 60
        if [ "$(docker inspect -f '{{.State.Running}}' dall-m-model-preload 2>/dev/null)" = true ]; then
          echo "  downloading MODEL: $(docker exec dall-m-model-preload du -sh /models 2>/dev/null | cut -f1) in the model cache so far"
        fi
      done
      if ! wait "$up"; then
        if [ "$(docker inspect -f '{{.State.Running}}' dall-m-model-preload 2>/dev/null)" = true ]; then
          echo "MODEL is still downloading after ${UP_TIMEOUT}s; it carries on in the background."
          echo "Run this pipeline again later: the deploy waits for it and starts llama-server."
        fi
        docker compose logs --tail 20 dall-m-model-preload dall-m-llamacpp
        exit 1
      fi
      # What the preload did this time: downloaded, or found it cached.
      docker compose logs --no-log-prefix --tail 5 dall-m-model-preload

    - echo "========== 2. Database schema =========="
    # Idempotent (CREATE TABLE IF NOT EXISTS, upserts) — safe on every deploy.
    # Run from a throwaway container on the compose network rather than via
    # `compose exec`: script/ is not copied into the dall-m-server image (its
    # Dockerfile only COPYs app/), so there is nothing in that container to run.
    #
    # The DB_* below are the CI variables themselves (this container gets
    # script/, not .env), passed by name: docker takes each value from this
    # job's environment, so no password is on a command line. Step 0
    # guarantees they are set; an empty one would reach os.getenv() as "set to
    # empty", not "unset", and the scripts would log in as nobody.
    #
    # No model name here: insert_default_model.py registers whatever
    # dall-m-llamacpp reports serving (LLM_BASE_URL), which is what
    # llamacpp/preload_models.py chose.
    #
    # script/ goes in as a tar on stdin, not `-v "$PWD/script:/script"`: this
    # docker run executes on the host's daemon, which resolves a bind mount
    # against the host's filesystem, where this job's checkout is not. Docker
    # then mounts an empty directory it made, and pip finds no
    # requirements.txt. A tar through the client carries the files.
    - |
      tar -C script -cf - . | docker run --rm -i --network agent-server_dall-m-net \
        -e http_proxy -e https_proxy -e no_proxy \
        -e DB_HOST=dall-m-db -e DB_PORT=5432 \
        -e DB_USER -e DB_PASSWORD -e DB_NAME \
        -e LLM_BASE_URL=http://dall-m-llamacpp:8080 \
        python:3.12-slim sh -c "mkdir /script && cd /script && tar -xf - \
          && pip install --no-cache-dir -q -r requirements.txt \
          && python create_db.py && python insert_default_model.py"

    - echo "========== 3. Admin user =========="
    # The first admin, from AGENT_ADMIN_USERNAME (default admin) and
    # AGENT_ADMIN_PASSWORD, with the email <username>@dall-m.local — created
    # only when no user of that name exists. Every deploy runs it and
    # none changes an existing user: a password changed in the admin UI stays
    # changed, and changing the CI variable later does not change it. Values
    # by name, as in step 2. The password is stored as plain text — what the
    # server's login compares against — so not one used anywhere else.
    # Then it logs in with them, as the admin UI would, and says whether that
    # works: "does NOT log in" means the user was made earlier with another
    # password (check_admin_login below shows which).
    - |
      tar -C script -cf - . | docker run --rm -i --network agent-server_dall-m-net \
        -e http_proxy -e https_proxy -e no_proxy \
        -e DB_HOST=dall-m-db -e DB_PORT=5432 \
        -e DB_USER -e DB_PASSWORD -e DB_NAME \
        -e AGENT_ADMIN_USERNAME -e AGENT_ADMIN_PASSWORD \
        python:3.12-slim sh -c "mkdir /script && cd /script && tar -xf - \
          && pip install --no-cache-dir -q -r requirements.txt \
          && python add_admin_user.py --if-missing --check-login http://dall-m-server:8000"

    - echo "========== 4. Health =========="
    - |
      healthy=""
      for i in $(seq 1 30); do
        if docker compose exec -T dall-m-server python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/',timeout=5).status==200 else 1)" 2>/dev/null; then
          healthy=yes; break
        fi
        sleep 4
      done
      if [ -z "$healthy" ]; then
        echo "dall-m-server did not become healthy within 2 minutes"
        docker compose logs --tail 50 dall-m-server dall-m-llamacpp
        exit 1
      fi
      echo "healthy inside the container"

    - echo "========== 5. Address =========="
    # Where each part answers from outside, asked the way a browser and
    # AI-Service will ask — this host's address and the published port — so a
    # port that is published but not reachable fails here too.
    #
    # The ports are what Docker published. The IP is the one this host sends
    # from on its default route, read from a throwaway container on the host's
    # network (this job's own container has another); the CI variable
    # DEPLOY_HOST overrides it — a DNS name, or another interface's address.
    # The admin UI is `next dev`, which compiles a page on its first request:
    # hence its longer wait.
    #
    # NEXT_PUBLIC_BASE_URL and NEXT_PUBLIC_LLM_BASE_URL are what the admin UI,
    # in the browser, calls: a port other than the published one is reported.
    - |
      published() { docker compose port "$1" "$2" | sed -n '1s/.*://p'; }
      api_port=$(published dall-m-server 8000)
      ui_port=$(published dall-m-frontend 7100)
      llm_port=$(published dall-m-llamacpp 8080)
      host="${DEPLOY_HOST:-}"
      if [ -z "$host" ]; then
        host=$(docker run --rm --network host --entrypoint sh "$CI_JOB_IMAGE" -c '
          { ip route get 1.1.1.1 2>/dev/null | sed -n "s/.* src \([0-9.]*\).*/\1/p"
            ip -4 -o addr show scope global | grep -v -E " (docker0|br-|veth)" | sed -n "s/.* inet \([0-9.]*\).*/\1/p"
          } | head -n 1')
      fi
      ask() { docker run --rm --network host --entrypoint wget "$CI_JOB_IMAGE" -qO- -T "$2" "$1"; }
      echo "Admin UI     http://$host:$ui_port"
      echo "API          http://$host:$api_port        (docs: /docs)"
      echo "llama.cpp    http://$host:$llm_port"
      echo "AI-Service   LLM_SERVER_URL=http://host.docker.internal:$api_port"
      failed=""
      for check in "API|http://$host:$api_port/|15" "llama.cpp|http://$host:$llm_port/health|15" "Admin UI|http://$host:$ui_port/|120"; do
        name=${check%%|*}; rest=${check#*|}; url=${rest%|*}; secs=${rest##*|}
        if ask "$url" "$secs" >/dev/null; then echo "  $name answers at $url"
        else echo "  $name does NOT answer at $url"; failed=yes; fi
      done
      for pair in "NEXT_PUBLIC_BASE_URL|${NEXT_PUBLIC_BASE_URL:-}|$api_port" "NEXT_PUBLIC_LLM_BASE_URL|${NEXT_PUBLIC_LLM_BASE_URL:-}|$llm_port"; do
        name=${pair%%|*}; rest=${pair#*|}; value=${rest%|*}; port=${rest##*|}
        case "$value" in
          *:"$port"|*:"$port"/*) ;;
          *) echo "  WARNING: $name is $value — the admin UI will call that, but the port published is $port" ;;
        esac
      done
      if [ -n "$failed" ]; then
        echo "Published but not reachable at $host. Set DEPLOY_HOST if clients reach"
        echo "this host by another name or interface."
        docker compose logs --tail 20 dall-m-server dall-m-llamacpp dall-m-frontend
        exit 1
      fi
      echo "DYNAMIC_ENVIRONMENT_URL=http://$host:$ui_port" > deploy.env
      echo ""
      echo "The three SOC agents (soc-suggest, soc-requirements, soc-conclude) are"
      echo "not created by this pipeline — create or update them by hand at the"
      echo "admin UI above or POST /restful/agents, the same way a first admin is"
      echo "provisioned by hand elsewhere in this stack."

    - echo "========== 6. Other models (in the background) =========="
    # ALSO_DOWNLOAD in llamacpp/preload_models.py, fetched ahead so that
    # switching MODEL to one of them is a restart, not a download. Started here,
    # last, once everything else is up and checked, and left running: through
    # the office proxy the first time takes hours, and nothing waits on it. A
    # deploy that finds it still downloading leaves it be (same image); a
    # finished one checks the cache and stops in seconds. Only here: the
    # service is in the "production" profile, so a laptop never starts it.
    # What it says in its first seconds is shown below — which models are
    # cached, which are downloading, which were skipped for disk space. The
    # next deploy shows the state again. Not a reason to fail the deploy: the
    # stack is up and checked by now.
    - |
      if docker compose --profile production build $PROXY_ARGS dall-m-model-extra \
         && docker compose --profile production up -d dall-m-model-extra; then
        sleep 20
        docker compose --profile production logs --no-log-prefix --tail 20 dall-m-model-extra
      else
        echo "the background download did not start (see above); the stack itself is up"
      fi
